aid: cherrypick
name: Cherrypick
description: >-
  Cherrypick is a London-based food-tech company (backed by Speedinvest) behind an all-in-one
  meal-planning and grocery-shopping mobile app. The app helps home cooks discover personalized
  recipes tailored to their dietary preferences, automatically plan their weekly meals, and turn
  those plans into a supermarket basket at real supermarket prices for home delivery or in-store
  pickup. Positioned as a lower-cost alternative to recipe-box subscription services, Cherrypick
  combines recipe discovery, meal planning, and grocery ordering into a single consumer experience
  aimed at saving people time and money while reducing food waste. Cherrypick is a consumer mobile
  application with no public developer, API, or partner-integration surface at this time; this
  API Evangelist profile tracks the company as a network entity rather than an API producer.
